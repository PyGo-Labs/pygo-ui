{# src/icons/icons.html #}
{#
  PyGo UI — Icon System
  Heroicons-based icon set
#}
{% macro icon(name, class="w-5 h-5") %}
<svg class="{{ class }}" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  {% if name == 'add' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m6-6h-6m-6 0H6"></path>
  {% elif name == 'edit' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 0L11.828 9.55a2 2 0 01-.784.55l-4 2a2 2 0 01-2.55-.784l-.55-4a2 2 0 01.55-2.55l2-2"></path>
  {% elif name == 'delete' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.971-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-1m-1 0H9a1 1 0 00-1 1v3m4 0H9"></path>
  {% elif name == 'search' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
  {% elif name == 'download' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M6 10l6 6 6-6"></path>
  {% elif name == 'close' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
  {% elif name == 'check' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
  {% elif name == 'user' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
  {% elif name == 'settings' %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.917c.426-1.753 1.5-3.284 2.88-4.182a.75.75 0 011.02.075L13.5 2.25v1.75a3.75 3.75 0 002.5 3.5V10a3.75 3.75 0 002.5 3.5l.119.285a.75.75 0 01-.074 1.004l-2.69 2.69a.75.75 0 01-1.004-.074l-.285-.119a3.75 3.75 0 00-3.5-2.5V9.25a3.75 3.75 0 00-2.5-3.5V.75a.75.75 0 01 .075-1.02z"></path>
  {% endif %}
</svg>
{% endmacro %}
