{# src/components/feedback/loading.html #}
{% macro spinner(size="md", color="blue") %}
<svg class="
  animate-spin
  {% if size == 'xs' %}h-3 w-3
  {% elif size == 'sm' %}h-4 w-4
  {% elif size == 'md' %}h-6 w-6
  {% elif size == 'lg' %}h-8 w-8
  {% elif size == 'xl' %}h-12 w-12{% endif %}
  text-{{ color }}-600"
  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
  <path class="opacity-75" fill="currentColor"
    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.14 5.824 3 7.938l3-2.647z"></path>
</svg>
{% endmacro %}

{% macro loading_overlay(text="Loading...") %}
<div class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex items-center justify-center">
  <div class="text-center">
    {{ spinner(size="lg") }}
    <p class="mt-4 text-gray-600">{{ text }}</p>
  </div>
</div>
{% endmacro %}

{% macro skeleton(class="h-4 w-full") %}
<div class="animate-pulse bg-gray-200 rounded {{ class }}"></div>
{% endmacro %}
