{# src/components/feedback/alert.html #}
{% macro alert(type="info", dismissible=true, class="") %}
<div x-data="{ show: true }"
  x-show="show"
  x-transition
  class="
    relative flex items-start p-4 rounded-lg
    {% if type == 'info' %}bg-blue-50 text-blue-800 border border-blue-200{% elif type == 'success' %}bg-green-50 text-green-800 border border-green-200{% elif type == 'warning' %}bg-amber-50 text-amber-800 border border-amber-200{% elif type == 'danger' %}bg-red-50 text-red-800 border border-red-200{% endif %}
    {{ class }}
  ">
  <div class="flex-shrink-0 mr-3">
    {% if type == 'info' %}
      <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m0-4h.01M12 11h.01M12 15h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    {% elif type == 'success' %}
      <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    {% elif type == 'warning' %}
      <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v4m0 4h.01m-6.8 0h13.6M5.5 15l7-7 7 7"></path>
      </svg>
    {% elif type == 'danger' %}
      <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    {% endif %}
  </div>

  <div class="ml-3 flex-1">
    <div class="font-medium text-sm">{{ slot }}</div>
  </div>

  {% if dismissible %}
    <button type="button" @click="show = false" class="ml-auto flex-shrink-0 rounded-md p-1 hover:bg-black/5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  {% endif %}

</div>
{% endmacro %}
