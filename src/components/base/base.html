{# src/components/base/base.html #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token or '' }}">
    <title>{% block title %}PyGo App{% endblock %}</title>

    {# PyGo UI Core Assets #}
    <link rel="stylesheet" href="/vendor/pygo-ui/pygo-ui.css">
    <script src="/vendor/pygo-ui/htmx.min.js"></script>
    <script src="/vendor/pygo-ui/alpine.min.js" defer></script>
    <script src="/vendor/pygo-ui/pygo-ui.js"></script>

    {# Optional: CDN fallbacks for dev #}
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 antialiased font-sans">
    {% block body %}
    <div id="app">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
