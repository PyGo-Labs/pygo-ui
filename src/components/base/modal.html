{# src/components/base/modal.html #}
{#
  PyGo UI — Modal Component
  Requires Alpine.js for interactivity
#}
{% macro modal(id, title=null, size="md") %}
<div x-data="{ open: false }"
  @open-modal-{{ id }}.window="open = true"
  @close-modal-{{ id }}.window="open = false"
  x-cloak>

  <!-- Backdrop -->
  <div x-show="open"
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity z-40"
    @click="open = false">
  </div>

  <!-- Modal panel -->
  <div class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div x-show="open"
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.outside="open = false"
        @keydown.escape.window="open = false"
        class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 {% if size == 'sm' %}sm:max-w-sm{% elif size == 'md' %}sm:max-w-lg{% elif size == 'lg' %}sm:max-w-2xl{% elif size == 'xl' %}sm:max-w-4xl{% elif size == 'full' %}sm:max-w-7xl{% endif %} w-full">

        {% if title %}
          <div class="px-4 pb-4 pt-5 sm:p-6 border-b">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-semibold leading-6 text-gray-900">{{ title }}</h3>
              <button @click="open = false" class="text-gray-400 hover:text-gray-500">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>
        {% endif %}

        <div class="px-4 py-5 sm:p-6">
          {{ slot }}
        </div>
      </div>
    </div>
  </div>
</div>
{% endmacro %}
