{# src/components/base/select.html #}
{% macro select(name, options=[], label=null, placeholder=null, error=null, help=null, class="") %}
<div class="mb-6">
  {% if label %}
    <label for="{{ name }}" class="block text-sm font-medium text-gray-700 mb-1">
      {{ label }}
    </label>
  {% endif %}
  <div class="relative">
    <select id="{{ name }}" name="{{ name }}"
      class="
        block w-full rounded-lg border
        {% if error %}border-red-300 text-red-900 focus:ring-red-500 focus:border-red-500
        {% else %}border-gray-300 text-gray-900 focus:ring-blue-500 focus:border-blue-500{% endif %}
        pl-3 pr-10 py-2 text-sm bg-white
        focus:outline-none focus:ring-2
        transition-colors
        {{ class }}
      " {{ attributes }}>
      {% if placeholder %}
        <option value="" disabled selected class="text-gray-400">{{ placeholder }}</option>
      {% endif %}
      {% for opt in options %}
        {% if opt.value %}
          <option value="{{ opt.value }}" {% if opt.selected %}selected{% endif %}>{{ opt.label }}</option>
        {% else %}
          <optgroup label="{{ opt.label }}">
            {% for sub in opt.options %}
              <option value="{{ sub.value }}" {% if sub.selected %}selected{% endif %}>{{ sub.label }}</option>
            {% endfor %}
          </optgroup>
        {% endif %}
      {% endfor %}
    </select>
    <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 9l-7 7-7-7"></path>
      </svg>
    </div>
  </div>
  {% if error %}
    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
  {% elif help %}
    <p class="mt-1 text-sm text-gray-500">{{ help }}</p>
  {% endif %}
</div>
{% endmacro %}
